name: DSH Bug Watch

on:
  schedule:
    # 每 6 小时一次：UTC 0/6/12/18，对应北京时间 8/14/20/02
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Override cursor (ISO date) to re-scan since this date'
        required: false
        default: ''

permissions:
  discussions: read
  contents: write

concurrency:
  group: dsh-bug-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SINCE_OVERRIDE: ${{ inputs.since }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须有写权限才能让下面的 git commit/push 工作
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch & digest bug discussions
        run: node scripts/fetch-bugs.mjs

      - name: Configure git for commit
        run: |
          git config user.name 'dsh-bug-watch[bot]'
          git config user.email 'dsh-bug-watch[bot]@users.noreply.github.com'
          # 把 GITHUB_TOKEN 注入到 remote URL，让 git push 能用 workflow token 鉴权
          git config --local url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Commit digest updates
        run: |
          # .gitignore 把 digest/ 排除了（本地调试用），这里强制 add
          git add -f digest/ || true
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "chore(bug-watch): refresh digest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi